<html>
<head>
<title>Online Shop</title>

<style>
body {
    text-align: center;
    background: lightblue;
    font-family: Arial;
}

.box {
    display: flex;
    justify-content: center;
    gap: 15px;
    background: white;
    margin: 30px auto;
    padding: 20px;
    width: 90%;
}

.product {
    padding: 10px;
    border: 1px solid gray;
    width: 200px;
}

img {
    width: 100px;
    height: 100px;
}

button {
    padding: 8px;
    background: green;
    color: white;
}
</style>
</head>

<body>

<h2>Online Shop</h2>

<div class="box">

    <div class="product">
        <img src="phone.jpg">
        <h3>Mobile Phone</h3>
        <p>Price: ₹10000</p>
        <button onclick="add(10000)">Add to Cart</button>
    </div>

    <div class="product">
        <img src="headphone.jpg">
        <h3>Headphones</h3>
        <p>Price: ₹1000</p>
        <button onclick="add(1000)">Add to Cart</button>
    </div>

    <div class="product">
        <img src="watch.jpg">
        <h3>Watch</h3>
        <p>Price: ₹2000</p>
        <button onclick="add(2000)">Add to Cart</button>
    </div>

</div>

<h3 id="cart">Cart Total: ₹0</h3>

<script>
let total = 0;

function add(price) {
    total += price;
    document.getElementById("cart").innerHTML =
        "Cart Total: ₹" + total;
}
</script>

</body>
</html>
